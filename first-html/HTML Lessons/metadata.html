<!DOCTYPE html>
<html>
    <head>
        <title>Metadata</title>
        <!--Metadata means the information of a specific set of data-->
        <!--UTF-8 stands for Unicode character set-->
        <meta charset="UTF-8">
        <meta name="keywords" content="HTML, tutorial, Bro Code, Youtube">
        <meta name="description" content="Bro Code HTML Tutorial for beginners">
        <meta name="author" content="Bro Code">
        <!--The following tag is used to help display the webpage on a specific device properly, for example, the code below helps to display the page on a phone properly-->
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <meta http-equiv="refresh" content="30">
        


    </head>
    <body>
        <center><h1>TESTING TEXT</h1></center>
    </body>
</html>
