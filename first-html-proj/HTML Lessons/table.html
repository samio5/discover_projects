<!DOCTYPE html>
<html>
<head>
    <title>Personal Finances table</title>
</head>
<body>
    <ins><center><h2>Personal Finances table.</h2></center></ins>

    <table border="3px" bgcolor=black height=150 width=100%>
        <tr bgcolor=grey>
            <th height=10 width=100>Month:</th>
            <th height=10 width=100>January</th>
            <th height=10 width=100>February</th>
            <th height=10 width=100>March</th>
            <th height=10 width=100>April</th>
        </tr>

        <br>

        <tr bgcolor=yellow align=center>
            <th>Income:</th>
            <td>$1500</td>
            <td>$2500</td>
            <td>$4120</td>
            <td>$830</td>
        </tr>

        <br>
        
        <tr bgcolor=red align=center>
            <th>Expenses:</th>
            <td>-$500</td>
            <td>-$1000</td>
            <td>-$250</td>
            <td>-$185</td>
        </tr>

        <br>

        <tr bgcolor=green align=center>
            <th>Savings:</th>
            <td>$1000</td>
            <td>$1500</td>
            <td>$3870</td>
            <td>$645</td>

        </tr>
    </table>

</body>

</html>
